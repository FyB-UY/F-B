<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&B SHOP - Inicio</title>
    <link rel="icon" type="image/png" href="img/tu-logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
    <style>
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s; color: white;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }
        .loader-logo { width: 150px; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="welcome-screen">
        <img src="img/tu-logo.png" alt="Logo" class="loader-logo">
        <h1>Bienvenidos a F&B SHOP</h1>
    </div>

    <header class="main-header">
        <nav class="navbar">
            <a href="index.html"><img src="img/tu-logo.png" alt="Logo" class="company-logo"></a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="digitales.html">Digitales</a></li>
                <li><a href="fisicos.html">Físicos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <h1>Bienvenidos a F&B SHOP</h1>
            <p>Descubre nuestra exclusiva selección de productos.</p>
            <a href="digitales.html" class="hero-cta-btn">Ver Productos</a>
        </div>
    </section>
<footer style="text-align: center; padding: 20px; background-color: #1a1a1a; color: #ffffff; border-top: 1px solid #333; margin-top: 50px;">
        <p>&copy; 2025/2026 F&B Profesional. Todos los derechos reservados.</p>
    </footer>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => document.getElementById('welcome-screen').classList.add('hidden'), 2000);
        });
    </script>
</body>
</html>
