<body>
    <header class="main-header">
        <nav class="navbar">
            <a href="index.html"><img src="img/tu-logo.png" alt="Logo" class="company-logo"></a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>

    <main style="padding: 120px 20px;">
        <section class="call-to-action">
            <h2>Contáctanos</h2>
            <a href="https://wa.me/59800000000" class="contact-btn" style="background:#25D366;"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            
            <div class="contact-form-container" style="max-width:500px; margin:40px auto; background:#f9f9f9; padding:30px; border-radius:15px;">
                <form action="https://formspree.io/f/TU_CORREO_AQUI" method="POST">
                    <input type="text" name="name" placeholder="Nombre" required style="width:100%; margin-bottom:10px; padding:10px;">
                    <input type="email" name="email" placeholder="Email" required style="width:100%; margin-bottom:10px; padding:10px;">
                    <textarea name="message" placeholder="Tu mensaje" rows="4" style="width:100%; margin-bottom:10px; padding:10px;"></textarea>
                    <button type="submit" class="hero-cta-btn" style="width:100%; border:none;">Enviar Mensaje</button>
                </form>
            </div>
        </section>
    </main>
</body>
